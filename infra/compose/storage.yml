services:
  storage:
    image: rustfs/rustfs@sha256:ed9210d6411d77ffceb70d94b964a3cb7d225983368bc25bebe01e995293dcc2
    command: ['/data']
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in ignored .env}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in ignored .env}
      RUSTFS_CONSOLE_ENABLE: 'false'
      RUSTFS_OBS_LOGGER_LEVEL: error
    ports: ['127.0.0.1:19000:9000']
    volumes: ['source-data:/data']
    logging:
      driver: local
      options: { max-size: '10m', max-file: '3' }
volumes:
  source-data:
