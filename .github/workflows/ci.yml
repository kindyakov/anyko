name: Scaffold CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scaffold:
    name: Scaffold checks (static and build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:8.10.3-alpine
        ports:
          - 16379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s
          --health-timeout 2s --health-retries 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.13.0
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.4
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Run available fast checks
        run: bun run verify:fast
      - name: Build applications
        run: bun run build
      - name: Worker integration against Redis
        env:
          TEST_REDIS_URL: redis://127.0.0.1:16379
        run: bun run test:worker:integration
