name: Scaffold CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scaffold:
    name: Scaffold checks (static and build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://anyko_test:anyko_test@127.0.0.1:5432/anyko_test
      TEST_DATABASE_URL: postgresql://anyko_test:anyko_test@127.0.0.1:5432/anyko_test
      TEST_REDIS_URL: redis://127.0.0.1:16379
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: anyko_test
          POSTGRES_PASSWORD: anyko_test
          POSTGRES_DB: anyko_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U anyko_test -d anyko_test"
          --health-interval 2s --health-timeout 2s --health-retries 20
      redis:
        image: redis:8.10.3-alpine
        ports:
          - 16379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s
          --health-timeout 2s --health-retries 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.13.0
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.4
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Run available fast checks
        # Generated code stays out of Git; build it from the committed schema.
        run: bun run db:generate
      - name: Run fast checks
        run: bun run verify:fast
      - name: Build applications
        run: bun run build
      - name: Processor lifecycle without model dependencies
        run: |
          python -m venv work/processor-tests-venv
          work/processor-tests-venv/bin/pip install --no-deps mineru==4.1.7
          work/processor-tests-venv/bin/pip install -r tests/processor/requirements.txt
          ANYKO_PROCESSOR_TEST_PYTHON=work/processor-tests-venv/bin/python bun run test:processor
      - name: Worker integration against Redis
        env:
          TEST_REDIS_URL: redis://127.0.0.1:16379
        run: bun run test:worker:integration
      - name: Apply test migrations
        run: bun run db:migrate
      - name: Document and access integration
        run: bun run test:documents:integration && bun run test:access:integration && bun run test:works:integration && bun run test:idempotency:integration && bun run test:audit:integration
      - name: Isolated E2E backend integration
        env:
          E2E_DATABASE_URL: postgresql://anyko_test:anyko_test@127.0.0.1:5432/anyko_e2e
          E2E_REDIS_URL: redis://127.0.0.1:16379
          E2E_OWNER_EMAIL: owner@example.test
          E2E_OWNER_PASSWORD: owner-fixture-password
          E2E_MEMBER_EMAIL: member@example.test
          E2E_MEMBER_PASSWORD: member-fixture-password
          E2E_OUTSIDER_EMAIL: outsider@example.test
          E2E_OUTSIDER_PASSWORD: outsider-fixture-password
          E2E_PROCESSING_DELAY_MS: 10
          API_PORT: 3031
          APP_ORIGIN: http://127.0.0.1:3030
          AUTH_BASE_URL: http://127.0.0.1:3031
          AUTH_SECRET: e2e-fixture-auth-secret-not-for-production
          LLM_CONFIG_ENCRYPTION_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        run: |
          bun -e "import { createDatabasePool } from '@anyko/database'; const pool = createDatabasePool(process.env.TEST_DATABASE_URL); await pool.query('CREATE DATABASE anyko_e2e'); await pool.end();"
          bun run test:e2e:config
          bun run test:e2e:integration
